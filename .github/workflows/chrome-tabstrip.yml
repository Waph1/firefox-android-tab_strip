# Verifica ogni giorno che la patch "tab strip in stile Chrome" si applichi ancora all'ultima versione stabile
# di Firefox per Android e, su richiesta, compila l'APK. Vedi chrome-tabstrip/README.md.
name: Chrome-like tab strip

on:
  schedule:
    - cron: "23 4 * * *"
  push:
    paths:
      - "chrome-tabstrip/**"
      - ".github/workflows/chrome-tabstrip.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Versione di Firefox: stable (ultima stabile), beta, main (Nightly) o un tag FIREFOX-ANDROID_..."
        required: true
        default: stable
      build:
        description: "Compila anche l'APK (richiede circa un'ora)"
        type: boolean
        default: false
      variant:
        description: "Variante dell'APK: release (Firefox), nightly (Firefox Nightly) o debug"
        required: true
        default: release

permissions:
  contents: read

jobs:
  check:
    name: La patch si applica?
    runs-on: ubuntu-latest
    env:
      FIREFOX_VERSION: ${{ inputs.version || 'stable' }}
    steps:
      - uses: actions/checkout@v4

      - name: Scarica Fenix (solo mobile/android/fenix)
        run: chrome-tabstrip/scripts/fetch-firefox.sh "$RUNNER_TEMP/firefox" --fenix

      - name: Verifica la patch
        run: chrome-tabstrip/scripts/apply.sh "$RUNNER_TEMP/firefox" --check

  build:
    name: Compila l'APK
    needs: check
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      FIREFOX_VERSION: ${{ inputs.version }}
    steps:
      - name: Libera spazio su disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/local/.ghcup "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/checkout@v4

      - name: Ripristina la chiave di firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
            echo "Uso la chiave di debug salvata nei secret."
          else
            echo "::warning::Secret ANDROID_DEBUG_KEYSTORE_BASE64 assente: l'APK avrà una chiave nuova."
          fi

      - name: Scarica Firefox
        run: |
          chrome-tabstrip/scripts/fetch-firefox.sh "$RUNNER_TEMP/firefox"
          echo "FX_VERSION=$(cat "$RUNNER_TEMP/firefox/mobile/android/version.txt")" >> "$GITHUB_ENV"

      - name: Applica la patch
        run: chrome-tabstrip/scripts/apply.sh "$RUNNER_TEMP/firefox"

      - name: Compila
        env:
          PRUNE_EMULATOR: "1"
          VARIANT: ${{ inputs.variant }}
        run: chrome-tabstrip/scripts/build.sh "$RUNNER_TEMP/firefox" "$VARIANT"

      - uses: actions/upload-artifact@v4
        with:
          name: firefox-${{ env.FX_VERSION }}-chrome-tabstrip-${{ inputs.variant }}
          path: ${{ runner.temp }}/firefox/objdir-chrome-tabstrip/gradle/build/mobile/android/fenix/app/outputs/apk/**/*.apk
          if-no-files-found: error
