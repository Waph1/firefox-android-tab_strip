---
name: Glean probe-scraper
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  glean-probe-scraper:
    # Registers the Glean metrics of Mozilla's repository with Mozilla's telemetry service: in forks it can only fail.
    if: github.repository == 'mozilla-mobile/firefox-android'
    uses: mozilla/probe-scraper/.github/workflows/glean.yaml@main
